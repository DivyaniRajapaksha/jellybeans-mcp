[project]
name = "jellybeans-mcp"
version = "0.1.0"
description = "Read-only MCP server for Jellybeans kids play area analytics, backed by MongoDB Atlas"
readme = "README.md"
authors = [
    { name = "Divyani Rajapaksha", email = "divyanirajapaksha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.13",
    "tzdata>=2026.5",
]

[project.scripts]
jellybeans-mcp = "jellybeans_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs MONGODB_URI (reads the live database)"]
